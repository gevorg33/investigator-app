packages:
  - apps/*
  - packages/*

# Install-time build scripts are denied by default and allowed case by case.
# Each entry is a reviewed supply-chain decision (launch-hardening).
allowBuilds:
  # Telemetry that phones home during install. Denied.
  '@scarf/scarf': false
  # Fetches the platform-specific binary. Required for drizzle-kit to run at all.
  esbuild: true
  # Native resolver for eslint-plugin-import-x. Allowed because without its build,
  # import-x/no-relative-packages silently matches nothing — verified by writing a
  # genuine cross-package import and seeing no error. A rule that appears to enforce
  # T-001 while doing nothing is worse than no rule.
  unrs-resolver: true

# Forced versions of transitive dependencies. Each entry is a reviewed supply-chain
# decision, with the reason it cannot be solved by bumping the direct dependency.
overrides:
  # GHSA-wc9g-mqfw-jrwm, GHSA-535w-7cp7-47q4 (DoS via crafted multipart field names, fixed
  # in >=2.3.0) and GHSA-qfvm-cv95-jqjf (DoS via file-descriptor leak, affects =2.2.0 only).
  # Every @nestjs/platform-express 11.x release pins multer to exactly 2.2.0, so no Nest
  # bump reaches the fix. Exact pin, not a range: 2.3.0 was ~17 days old when chosen, past
  # the ~2-week bar CLAUDE.md applies, and a security patch in the same minor line. Remove
  # this once platform-express depends on >=2.3.0 itself.
  multer: 2.3.0
  # GHSA-6g55-p6wh-862q and GHSA-r28c-9q8g-f849 (HIGH: arbitrary file read, and path traversal via
  # source-map auto-loading), plus GHSA-qx2v-qp2m-jg93 and GHSA-fxqj-rqcc-2cmp (moderate), all
  # fixed in postcss >=8.5.23. Every next 15.x release pins postcss to exactly 8.4.31, so no bump
  # within the pinned 15.5 line reaches the fix (T-091). Scoped to next's own copy, and pinned to
  # 8.5.23 — the version next 16 itself ships, 61 days old when chosen, same major. Remove this
  # when the app moves to a next release that depends on >=8.5.23 itself.
  'next>postcss': 8.5.23
