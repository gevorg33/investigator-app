# Overlaps a person has read and found consistent (T-016).
#
# The sync flags two current documents that answer the same question for overlapping readers,
# because it cannot tell agreement from contradiction. An entry here records that someone read
# both answers and they agree. It names each document AT A VERSION: a new version of either
# lapses the review, and the overlap is flagged again until someone reads it again.
#
# Two documents that disagree are not reviewed here — one of them is edited or superseded.
#
# Fields: subject (the question, lower case, no question mark), documents (two `id@version`),
# reviewed (date), by, finding.

- subject: who can see my evidence and reports
  documents: [kb-customer-privacy-data@5, kb-policy-privacy-summary@1]
  reviewed: 2026-10-01
  by: Claude (agent), for the owner's confirmation
  finding: 'consistent — both say only the parties see evidence by default and staff access needs a recorded reason. Re-read at @3 (T-054): v3 changed only who can see a published mission, not this answer. Re-read at @4 (T-100): v4 changed only how investigators see a customer before hire; this section is word for word as at @3. Re-read at @5 (T-035): v5 added only a section on legal holds; this section is unchanged'

- subject: what data does the platform hold about me
  documents: [kb-customer-privacy-data@5, kb-policy-privacy-summary@1]
  reviewed: 2026-10-01
  by: Claude (agent), for the owner's confirmation
  finding: 'consistent — the same list; the public summary adds what investigators have held. Re-read at @3 (T-054): unchanged. Re-read at @4 (T-100): unchanged. Re-read at @5 (T-035): unchanged'

- subject: how long is my data kept
  documents: [kb-customer-privacy-data@5, kb-policy-privacy-summary@1]
  reviewed: 2026-10-01
  by: Claude (agent), for the owner's confirmation
  finding: 'consistent — both say retention differs by type and nothing is kept indefinitely. Re-read at @3 (T-054): unchanged. Re-read at @4 (T-100): unchanged. Re-read at @5 (T-035): unchanged; the new legal-hold section keeps data only while the law requires it, which the summary’s “subject to what must legally be retained” already says'
