# Pull request CI. Runs on open and on every push to an open PR.
# Contract: .claude/skills/ci-cd/SKILL.md
# UNVALIDATED — written before the monorepo exists. T-028 owns the first green run.
name: PR

on:
  pull_request:
    branches: [dev, prod]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read # least privilege; a job needing more asks for exactly that
  pull-requests: read # gitleaks-action reads the PR's commits; read-only, since its comments are off

env:
  # The owner: migrations and test fixtures only (T-073). DATABASE_URL — the runtime role the
  # API and the code under test connect as — is set after migrations, with a per-run password.
  MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/investigator_test
  REDIS_URL: redis://localhost:6379
  # No production secret is reachable here. Fork PRs receive no secrets at all.

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Fresh services every run: no cached database, no reused volume.
    services:
      postgres:
        # pgvector base + PostGIS installed in the step below. postgis/postgis
        # ships no pgvector, so `CREATE EXTENSION vector` would fail against it —
        # and it publishes amd64 only, which differs from local dev on Apple Silicon.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: investigator_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the secret scan needs it

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # single source of truth; see CLAUDE.md pinned versions
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install PostGIS into the service container
        run: |
          docker exec "$(docker ps -q --filter ancestor=pgvector/pgvector:pg17)" \
            bash -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              postgresql-17-postgis-3 postgresql-17-postgis-3-scripts"

      - name: Enable extensions
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d investigator_test \
            -f infrastructure/docker/postgres/init/01-extensions.sql

      # Proves migrations apply to an EMPTY database, in sequence, with no manual state.
      - name: Migrate from empty
        run: pnpm --filter api migration:run

      # T-073: everything after this connects as investigator_app — not a superuser, no
      # BYPASSRLS, owns nothing — so row-level security applies, as it will in production.
      # The password is generated for this run, masked in logs, and set by the same script the
      # production deploy uses. If it failed, every database test below would fail to connect.
      - name: Runtime role with a per-run password
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          APP_DB_PASSWORD="$pw" ./scripts/set-app-role-password.sh
          echo "DATABASE_URL=postgres://investigator_app:${pw}@localhost:5432/investigator_test" >> "$GITHUB_ENV"

      # `--if-present` because fixtures are T-042's to build and no package defines the
      # script yet; this step referenced it before it existed and failed the first run CI
      # ever did. T-042 must assert the step stops being a no-op -- a green step that runs
      # nothing is how the coverage gate went unnoticed for four tasks (T-063).
      - name: Load fixtures
        run: pnpm -r --if-present fixtures:load

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: API tests
        run: pnpm test:api

      - name: E2E — critical workflows
        run: pnpm test:e2e

      # Blocking. Per package, not global. Exclusions: docs/operations/coverage-exclusions.md
      - name: Coverage gate
        run: pnpm test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: '**/coverage/'
          retention-days: 14

      - name: Build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      # Full history, not only this PR's diff: a secret committed and later deleted is still
      # in the history anyone can clone. The token lets the action read the PR's commits.
      # Comments are off so the job needs no write permission -- a finding fails this job and
      # is listed in its summary instead. Personal account, so no GITLEAKS_LICENSE is needed.
      # v3 changes only the runtime (Node 24); v2 ran on the deprecated Node 20.
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
