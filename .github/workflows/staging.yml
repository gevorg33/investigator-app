name: Staging

on:
  push:
    branches: [dev]

concurrency:
  group: staging
  cancel-in-progress: false # never cancel a deploy mid-flight

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging # staging secrets only — never production
      url: https://app.staging.example

    steps:
